            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 60px 20px 30px;
            text-align: center;
        }
        header h1 {
            font-size: 48px;
            margin: 0 0 10px;
            color: #FFD700;
        }
        header p {
            font-size: 18px;
            color: #999;

        }
        .games {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 40px 20px 60px;
            max-width: 900px;
        }
        .game-card {
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 30px;
            width: 260px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #FFD700;
        }
        .game-card h2 {
            color: #FFD700;
            font-size: 24px;
            margin: 0 0 10px;
        }
        .game-card p {
            color: #999;
            font-size: 14px;
            margin: 0 0 20px;
            line-height: 1.5;
        }
        .game-card .btn {
            display: inline-block;
            background: #FFD700;
            color: #1e1e1e;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .game-card .btn:hover {
            background: #FFC700;
        }
        .badge {
            display: inline-block;
            background: #4a6d4a;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
    </style>
